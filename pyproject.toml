[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-comment-scraper"
version = "0.1.0"
description = "抖音评论区采集工具 — 搜索视频、提取评论、导出报告"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["douyin", "tiktok", "scraper", "comments", "playwright"]

authors = [
    {name = "douyin-comment-scraper contributors"},
]

dependencies = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/lovejhowe123-commits/douyin-comment-scraper"
Repository = "https://github.com/lovejhowe123-commits/douyin-comment-scraper"

[project.scripts]
douyin-scrape = "douyin_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["douyin_scraper*"]